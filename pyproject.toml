[project]
name = "pinboard-agent"
version = "0.1.0"
description = "Cloud-first personal AI assistant on deepagents: GCP sandbox, GCS skills, guardrails, vault"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "langchain-tavily>=0.2",
    "langchain-google-genai>=4.0",
    "google-cloud-aiplatform[agent_engines]>=2.3.0",
    "google-cloud-storage>=3.0",
    "google-cloud-secret-manager>=2.20",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "pyyaml>=6.0",
    "agentmail>=2.0.13",
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.34.2",
    "httpx>=0.27",
    "mcp>=1.12,<2",
    "croniter>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
anthropic = ["langchain-anthropic>=1.0"]

[project.scripts]
pinboard = "pinboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
